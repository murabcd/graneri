name: ci

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build artifact worker
        run: docker build --file apps/artifact-worker/Dockerfile.vercel --tag graneri-artifact-worker:test apps/artifact-worker

      - name: Check artifact worker
        run: |
          docker run --rm --user root \
            --env RUFF_CACHE_DIR=/tmp/ruff-cache \
            --volume "$PWD/apps/artifact-worker:/workspace:ro" \
            --workdir /workspace \
            graneri-artifact-worker:test \
            sh -c 'pip install --no-cache-dir --requirement requirements-dev.txt && ruff check src tests && ruff format --check src tests'

      - name: Test artifact worker
        run: |
          docker run --rm \
            --volume "$PWD/apps/artifact-worker/tests:/app/tests:ro" \
            graneri-artifact-worker:test \
            python -m unittest discover --start-directory tests --verbose

  deploy:
    needs: validate
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-vercel.yml
    secrets: inherit
